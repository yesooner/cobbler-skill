<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cobbler Skill</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; background: #0d1117; color: #c9d1d9; }
    .container { text-align: center; padding: 40px; max-width: 600px; }
    h1 { font-size: 2.5em; margin-bottom: 20px; color: #58a6ff; }
    p { font-size: 1.1em; margin-bottom: 30px; color: #8b949e; line-height: 1.6; }
    .links { display: flex; gap: 20px; justify-content: center; flex-wrap: wrap; }
    .btn { padding: 14px 32px; font-size: 1em; border-radius: 8px; text-decoration: none; transition: all 0.2s; font-weight: 500; }
    .btn-en { background: #238636; color: #fff; border: 1px solid #238636; }
    .btn-en:hover { background: #2ea043; }
    .btn-zh { background: #1f6feb; color: #fff; border: 1px solid #1f6feb; }
    .btn-zh:hover { background: #388bfd; }
    .auto { font-size: 0.85em; color: #6e7681; margin-top: 30px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Cobbler Skill</h1>
    <p>AI Agent 框架研究与优化 Skill</p>
    <div class="links">
      <a href="en.html" class="btn btn-en">English</a>
      <a href="zh.html" class="btn btn-zh">中文</a>
    </div>
    <p class="auto">Select your language / 选择语言</p>
  </div>
  <script>
    // Auto redirect by browser language
    var lang = navigator.language || navigator.userLanguage;
    if (lang.indexOf('zh') === 0) {
      window.location.href = 'zh.html';
    } else {
      window.location.href = 'en.html';
    }
  </script>
</body>
</html>
